app:
  name: Project Alpha 2.0
  version: 2.0.0
  env: development
  log_level: INFO
server:
  host: 0.0.0.0
  port: 8001
  ws_throttle_ms: 250
redis:
  host: localhost
  port: 6379
  db: 0
  market_channel: channel:market_ticks
  simulated_channel: channel:simulated_ticks
  signals_channel: channel:signals
  telemetry_channel: channel:telemetry
database:
  url: postgresql+asyncpg://alpha_user:alpha_password@localhost:5432/alpha_db
angel_one:
  api_key: ${ANGEL_API_KEY}
  client_code: ${ANGEL_CLIENT_CODE}
  pin: ${ANGEL_PIN}
  totp_token: ${ANGEL_TOTP_TOKEN}
  instrument_master_url: https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json
  feed_token: ''
risk:
  total_account_equity: 100000.0
  risk_per_trade_pct: 0.01
  daily_max_drawdown_pct: 0.025
  sl_floor_ratio: 0.8
  sl_floor_threshold: 0.75
  rr_ratio: 2.0
  expiry_gate_enabled: true
  expiry_cutoff_time: '14:15'
  runaway_profiles:
    default:
      surge_pct: 0.035
      time_window_sec: 30
    GAMMA_SCALP:
      surge_pct: 0.08
      time_window_sec: 15
    VWAP_EMA:
      surge_pct: 0.05
      time_window_sec: 25
    ORB_BREAKOUT:
      surge_pct: 0.035
      time_window_sec: 30
    OI_SQUEEZE:
      surge_pct: 0.04
      time_window_sec: 25
    MOMENTUM_IMPULSE:
      surge_pct: 0.1
      time_window_sec: 15
    SIMPLIFIED_VWAP_EMA:
      surge_pct: 0.05
      time_window_sec: 25
telegram:
  enabled: true
  parse_mode: HTML
  rate_limit_per_sec: 1.0
  notifications:
    signals: true
    radar_precursors: false
    resolutions: true
  periodic_reports:
    enabled: false
    interval_minutes: 15
    start_time: 09:30
    schedule_times:
    - 09:30
    - 09:45
    - '10:00'
    - '10:15'
    - '10:30'
    - '10:45'
    - '11:00'
    - '11:15'
    - '11:30'
    - '11:45'
    - '12:00'
    - '12:15'
    - '12:30'
    - '12:45'
    - '13:00'
    - '13:15'
    - '13:30'
    - '13:45'
    - '14:00'
    - '14:15'
    - '14:30'
    - '14:45'
    - '15:00'
    - '15:15'
execution:
  enabled: true
  mode: PAPER
  dry_run: true
  total_capital: 25000.0
  force_single_lot: true
  default_product_type: INTRADAY
  default_order_type: LIMIT
  slippage_buffer_pct: 0.5
  max_capital_per_trade: 25000.0
  max_daily_loss: 4000.0
  max_active_orders: 2
  kill_switch_active: false
  audit_log_dir: data/execution_logs
  allowed_strategies:
  - OI_SQUEEZE
  - VWAP_EMA
  - SIMPLIFIED_VWAP_EMA
  - MOMENTUM_IMPULSE
  - ORB_BREAKOUT
  nifty_lots: 1
  sensex_lots: 1
