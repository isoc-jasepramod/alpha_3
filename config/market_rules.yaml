instruments:
  NIFTY:
    symbol: "NIFTY"
    name: "NIFTY 50"
    spot_token: "99926000"
    spot_exchange: "nse_cm"
    opt_exchange: "nfo_fo"
    strike_interval: 50
    default_lot_size: 65
    gamma_premium_min: 25.0
    gamma_premium_max: 60.0
    expiry_day: 1  # 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri (dynamically resolved)
  SENSEX:
    symbol: "SENSEX"
    name: "BSE SENSEX"
    spot_token: "99919000"
    spot_exchange: "bse_cm"
    opt_exchange: "bfo_fo"
    strike_interval: 100
    default_lot_size: 20
    gamma_premium_min: 60.0
    gamma_premium_max: 150.0
    expiry_day: 3  # Thursday (dynamically resolved)

trading_hours:
  market_open: "09:15:00"
  market_close: "15:30:00"
  master_sync_time: "08:30:00"

strategies:
  oi_squeeze:
    enabled: true
    start_time: "09:15:00"
    end_time: "15:30:00"
    lookback_window_sec: 300
    min_oi_drop_pct: -5.0
    min_price_spike_pct: 3.0
    early_ignition_oi_drop_pct: -2.0
    early_ignition_price_spike_pct_expiry: 8.0     # 0-DTE / high gamma
    early_ignition_price_spike_pct_standard: 12.0  # non-expiry day
    vol_multiplier: 2.0
    strikes_monitored: [-2, -1, 0, 1, 2] # ATM-2 to ATM+2
  
  orb_breakout:
    enabled: true
    start_time: "09:15:00"
    end_time: "10:30:00"
    orb_window_start: "09:15:00"
    orb_window_end: "09:30:00"
    buffer_margin_factor: 0.0003
    min_rvol: 1.50
    candle_timeframe_min: 5
    max_gap_pct: 0.40
    extreme_gap_pct: 1.50
    contact_multiplier: 1.80        # Volume spike threshold for level contact
    min_dry_bars: 2                 # Bars of volume contraction before ignition
    max_triggers_per_dir: 2         # Re-entry cap: max ORB triggers per CE/PE per day (prevents 0/20 whipsaw)
    retrigger_cooldown_sec: 900     # Min 15 min between ORB triggers (was re-firing every 5 min)

  vwap_ema:
    enabled: true
    start_time: "09:15:00"
    end_time: "15:15:00"
    candle_timeframe_min: 3
    ema_fast: 9
    ema_slow: 21
    vwap_touch_tolerance: 0.0005
    min_bottom_wick_ratio: 0.35
    min_top_wick_ratio: 0.15
    contact_multiplier: 1.80        # Institutional volume contact multiplier
    min_dry_bars: 3                 # Volume dry-up contraction bars
    ignition_multiplier: 2.0        # Volume ignition multiplier following dry-up
    rsi_period: 14
    rsi_ce_min: 48.0
    rsi_ce_max: 72.0
    rsi_pe_min: 18.0
    rsi_pe_max: 52.0


  gamma_scalp:
    enabled: true
    start_time: "13:15:00"
    end_time: "15:30:00"
    consolidation_start: "12:00:00"
    consolidation_end: "13:00:00"
    min_roc_3m_pct: 0.10
    max_mid_range_pct: 0.003        # was 0.005 — tighter consolidation (≤0.3% of spot)
    min_vol_multiplier: 2.5
    vol_sma_period: 20
    premium_staleness_pct: 10.0     # reject if premium already surged >10% from 3-min low
    watch_proximity_pct: 0.08       # tightened from 0.15% to 0.08% for clean boundary proximity
    min_approach_velocity_pct: 0.04 # real velocity required to arm (≥0.04%/30s approach)
    armed_cooldown_sec: 300.0       # 5-min rate limit & directional lock across CE/PE
    armed_ttl_sec: 300.0            # Validity window for armed setup awaiting breakout

  momentum_impulse:
    enabled: true
    start_time: "09:20:00"
    end_time: "15:20:00"
    nifty_velocity_pts: 25.0        # >= 25 pt move in <= 20s
    sensex_velocity_pts: 75.0       # >= 75 pt move in <= 20s
    window_sec: 20.0
    min_tick_count: 4
    min_directional_pct: 0.70       # 70% directional tick consistency
    radar_velocity_ratio: 0.50      # Radar pre-alert at 50% of threshold (earlier heads-up; was 0.65)
    min_opt_surge_pct: 3.5          # ATM Option must be expanding by at least +3.5%
    max_opt_surge_pct: 16.0         # Reject if option already surged > 16.0% (avoids buying top)
    impulse_ttl_sec: 25.0           # Validity window for armed impulse awaiting option tick
    cooldown_sec: 90.0
    # --- Acceleration pre-alert (earliest, lowest-confidence heads-up) ---
    accel_enabled: true
    nifty_accel_min_recent_vel: 2.5   # min pts/s in recent sub-window to be "accelerating" (NIFTY)
    sensex_accel_min_recent_vel: 7.5  # min pts/s in recent sub-window to be "accelerating" (SENSEX)
    accel_recent_window_sec: 5.0      # recent sub-window compared against the prior sub-window
    accel_ratio: 1.6                  # recent velocity must exceed older velocity by this factor
    # --- Post-impulse pullback entry (human-takeable; the reliable entry) ---
    pullback_enabled: true
    pullback_max_retrace: 0.50        # a dip up to 50% of the impulse still counts as shallow
    pullback_resume_frac: 0.15        # must recover 15% of impulse size off the dip to confirm hold
                                      # (lowered from 0.20 — Sep 29 backtest showed 0.20 was too
                                      #  strict and filtered out a valid resumption; revisit as more
                                      #  recorded days accumulate)
    pullback_window_sec: 90.0         # how long after arming we keep waiting for a valid pullback

  regime_filter:
    enabled: true
    trending_threshold: 65.0        # >= 65: TRENDING_BULL / TRENDING_BEAR (all setups allowed)
    neutral_threshold: 45.0         # 45-64: NEUTRAL (only Volume Contact / Dry-Up Ignition allowed)
    er_lookback: 10                 # Efficiency Ratio lookback bars
    vwap_persistence_lookback: 10   # Bars evaluated for closes on same side of VWAP
    vwap_slope_lookback: 5          # Bars evaluated for VWAP drift
    nifty_target_slope: 0.50        # Target slope for NIFTY (pts/bar)
    sensex_target_slope: 1.50       # Target slope for SENSEX (pts/bar)
    weight_adx: 0.30                # ADX strength weight (30%)
    weight_er: 0.30                 # Efficiency Ratio weight (30%)
    weight_persistence: 0.25        # VWAP Persistence weight (25%)
    weight_slope: 0.15              # VWAP Slope weight (15%)
    # --- Hysteresis (anti-thrash) ---
    # Sep 29 recorded 305 regime transitions on a choppy day because the classifier
    # flipped instantly on every threshold crossing. Deadband + confirmation bars fix this.
    hysteresis_enabled: true
    trending_exit_band: 5.0         # Must fall below (trending_threshold - band) to LEAVE trending (65 enter / 60 exit)
    choppy_exit_band: 5.0           # Must rise above (neutral_threshold + band) to LEAVE choppy (45 enter / 50 exit)
    confirm_bars_trending: 2        # Consecutive candidate bars required to COMMIT a TRENDING regime
    confirm_bars_relax: 1           # Consecutive candidate bars required to relax toward NEUTRAL/CHOPPY
    direction_min_slope: 0.05       # |vwap_slope| must exceed this (pts/bar) for a directional (BULL/BEAR) stamp
    # --- Session net-change anchor ---
    # A directional trend label must agree with the day's actual net move (vs previous
    # close, else session open). Blocks the "TREND UP on a red day" mislabel. If the
    # VWAP-derived direction conflicts with a clear net-change, the regime is demoted to NEUTRAL.
    net_change_anchor_enabled: true
    net_change_deadband_pct: 0.10   # net move smaller than 0.10% of price = no enforced bias (flat day)

