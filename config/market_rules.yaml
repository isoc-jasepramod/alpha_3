instruments:
  NIFTY:
    symbol: "NIFTY"
    name: "NIFTY 50"
    spot_token: "99926000"
    spot_exchange: "nse_cm"
    opt_exchange: "nfo_fo"
    strike_interval: 50
    default_lot_size: 65
    gamma_premium_min: 25.0
    gamma_premium_max: 60.0
    expiry_day: 1  # 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri (dynamically resolved)
  SENSEX:
    symbol: "SENSEX"
    name: "BSE SENSEX"
    spot_token: "99919000"
    spot_exchange: "bse_cm"
    opt_exchange: "bfo_fo"
    strike_interval: 100
    default_lot_size: 20
    gamma_premium_min: 60.0
    gamma_premium_max: 150.0
    expiry_day: 3  # Thursday (dynamically resolved)

trading_hours:
  market_open: "09:15:00"
  market_close: "15:30:00"
  master_sync_time: "08:30:00"

strategies:
  flow_engine:
    # DORMANT. Legacy CVD/absorption engine. Validated against Oct 1 recorded ticks:
    # the deque(maxlen=120) truncates the intended 90s CVD-surge window ~99.9% of the time,
    # and the alerts it does emit are uncalibrated, single-signed (morning CE) and reinforced
    # that day's losing bias. Superseded by flow_v2. Keep disabled; use flow_v2 for order flow.
    enabled: false

  flow_v2:
    # Estimated order-flow engine (quote-based trade classification via best-5 depth +
    # estimated delta/CVD/pressure/depth-imbalance/absorption -> FlowIndex). Depth decode is
    # live-verified. Ships DISABLED until validated on multiple days of recorded depth data.
    enabled: false
    start_time: "09:20:00"
    end_time: "15:25:00"
    window_sec: 60.0
    z_window: 200
    z_min_samples: 30
    depth_weights: [1.0, 0.75, 0.50, 0.30, 0.15]
    weights:                        # STARTING config, NOT validated — tune via backtest
      delta: 0.30
      delta_velocity: 0.20
      pressure: 0.15
      depth: 0.10
      oi: 0.10
      volume: 0.10
      efficiency: 0.05
    absorption_delta_z: 0.5
    absorption_price_z: 0.3
    absorption_min_persist: 2

  oi_squeeze:
    enabled: true
    start_time: "09:15:00"
    end_time: "15:30:00"
    # OI from the broker refreshes only ~every 162s (verified on recorded data), so a 300s
    # window captured only ~2 OI data points and the -2% early threshold sat BELOW the median
    # single-refresh step (~2.87%) — OI quantization noise alone could trip it. 600s spans
    # ~4 refreshes (a real ΔOI slope) and -4% clears the 600s noise floor (~4.1% median |ΔOI|).
    # Measured effect: expectancy -2.23% -> -1.10%/trade (partial fix; price-spike term still
    # dominates signal selection — exit redesign + exhaustion filter are the larger levers).
    lookback_window_sec: 600
    min_oi_drop_pct: -5.0
    min_price_spike_pct: 3.0
    early_ignition_oi_drop_pct: -4.0
    early_ignition_price_spike_pct_expiry: 8.0     # 0-DTE / high gamma
    early_ignition_price_spike_pct_standard: 12.0  # non-expiry day
    vol_multiplier: 2.0
    strikes_monitored: [-2, -1, 0, 1, 2] # ATM-2 to ATM+2
    require_spot_confirmation: false  # HARD directional gate (spot must be clearly on the correct
                                      # side of EMA20). SHIPPED DISABLED: backtest on 3 days did NOT
                                      # validate it as a clean filter (non-monotonic; only looked good
                                      # at a 2-trade sample). Mechanism kept for future tuning once
                                      # more live days accumulate. Set true to re-enable.
    spot_confirm_margin_pct: 0.05     # required distance of spot from EMA20, as % of spot
  
  orb_breakout:
    enabled: true
    start_time: "09:15:00"
    end_time: "10:30:00"
    orb_window_start: "09:15:00"
    orb_window_end: "09:30:00"
    buffer_margin_factor: 0.0003
    min_rvol: 1.80          # reconciled with code default; on corrected delta volume ~15% of
                            # 5m candles clear this (a genuine 1.8x surge vs 20-candle baseline)
    candle_timeframe_min: 5
    max_gap_pct: 0.40
    extreme_gap_pct: 1.50
    contact_multiplier: 1.80        # Volume spike threshold for level contact
    min_dry_bars: 2                 # Bars of volume contraction before ignition

  vwap_ema:
    enabled: true
    start_time: "09:15:00"
    end_time: "15:15:00"
    candle_timeframe_min: 3
    ema_fast: 9
    ema_slow: 21
    vwap_touch_tolerance: 0.0005
    min_bottom_wick_ratio: 0.35
    min_top_wick_ratio: 0.15
    contact_multiplier: 1.80        # Institutional volume contact multiplier
    min_dry_bars: 3                 # Volume dry-up contraction bars
    ignition_multiplier: 2.0        # Volume ignition multiplier following dry-up
    rsi_period: 14
    rsi_ce_min: 48.0
    rsi_ce_max: 72.0
    rsi_pe_min: 18.0
    rsi_pe_max: 52.0
    min_opt_rvol: 1.20              # REAL volume gate on the matching ATM option at confirmation
                                    # (index spot has no volume; option volume is genuine). Passes
                                    # if the option volume baseline isn't warm yet.


  gamma_scalp:
    enabled: true
    start_time: "13:15:00"
    end_time: "15:30:00"
    consolidation_start: "12:00:00"
    consolidation_end: "13:00:00"
    min_roc_3m_pct: 0.10
    max_mid_range_pct: 0.003        # was 0.005 — tighter consolidation (≤0.3% of spot)
    min_vol_multiplier: 2.5
    vol_sma_period: 20
    premium_staleness_pct: 10.0     # reject if premium already surged >10% from 3-min low
    watch_proximity_pct: 0.15       # fire WATCH alert when spot within 0.15% of H_mid/L_mid

  momentum_impulse:
    enabled: true
    start_time: "09:20:00"
    end_time: "15:20:00"
    nifty_velocity_pts: 25.0        # >= 25 pt move in <= 20s
    sensex_velocity_pts: 75.0       # >= 75 pt move in <= 20s
    window_sec: 20.0
    min_tick_count: 4
    min_directional_pct: 0.70       # 70% directional tick consistency
    radar_velocity_ratio: 0.65      # Radar pre-alert at 65% of threshold (~16.25 Nifty / ~48.75 Sensex)
    min_opt_surge_pct: 3.5          # ATM Option must be expanding by at least +3.5%
    max_opt_surge_pct: 16.0         # Reject if option already surged > 16.0% (avoids buying top)
    impulse_ttl_sec: 25.0           # Validity window for armed impulse awaiting option tick
    cooldown_sec: 90.0

  regime_filter:
    enabled: true
    trending_threshold: 65.0        # >= 65: TRENDING_BULL / TRENDING_BEAR (all setups allowed)
    neutral_threshold: 45.0         # 45-64: NEUTRAL (only Volume Contact / Dry-Up Ignition allowed)
    er_lookback: 10                 # Efficiency Ratio lookback bars
    vwap_persistence_lookback: 10   # Bars evaluated for closes on same side of VWAP
    vwap_slope_lookback: 5          # Bars evaluated for VWAP drift
    nifty_target_slope: 0.50        # Target slope for NIFTY (pts/bar)
    sensex_target_slope: 1.50       # Target slope for SENSEX (pts/bar)
    weight_adx: 0.30                # ADX strength weight (30%)
    weight_er: 0.30                 # Efficiency Ratio weight (30%)
    weight_persistence: 0.25        # VWAP Persistence weight (25%)
    weight_slope: 0.15              # VWAP Slope weight (15%)

  simplified_price_action:
    enabled: true
    start_time: "09:15:00"
    end_time: "15:15:00"
    cooldown_sec: 180.0
    min_adx: 22.0
    rsi_ce_min: 50.0
    rsi_ce_max: 66.0
    rsi_pe_min: 34.0
    rsi_pe_max: 50.0
    min_bottom_wick_ratio: 0.35
    min_top_wick_ratio: 0.15
    min_opt_rvol: 1.20
    require_opt_rvol: true
    max_ema21_dist_nifty: 35.0
    max_ema21_dist_sensex: 100.0
    max_consecutive_stops_dir: 2
    stop_pause_sec: 900.0



